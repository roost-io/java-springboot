scenarios:
  - name: "Product Update sequence"
    flow:
      # PUT request on /products/{productId} endpoint to update product data
      - put: 
          url: "/products/{{ id }}"
          headers:
            authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
